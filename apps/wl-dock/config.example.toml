# wl-dock example configuration
#
# Copy this file to ~/.config/wl-dock/config.toml (or
# $XDG_CONFIG_HOME/wl-dock/config.toml) and uncomment what you want to change:
#
#   mkdir -p ~/.config/wl-dock
#   cp config.example.toml ~/.config/wl-dock/config.toml
#
# Every setting is optional; the commented values are the defaults, except
# where a comment says "example". Sizes are pixels, times are milliseconds.
# Changes are picked up while the dock runs.

# --- Dock -----------------------------------------------------------------
# General settings stay at the root, before any [table] header.

#output = "all"                  # all, or an output pattern (see Outputs)
#position = "bottom"             # bottom, left, right
#layer = "top"                   # top, overlay
#icon-size = 48                  # 16–256
#icon-gap = 6
#margin = 6                      # Distance from the screen edge
#padding = 6                     # Space inside the panel
#magnification = 1.8             # 1–3; 1 disables it
#magnification-range = 3.0       # Neighbours on each side that grow; 1–10
#reserve = true                  # Keep windows out of the resting dock's area
#hover-delay = 300
#labels = true                   # Show the hovered app's name
#indicator = "dot"               # dot, dots (one per window, up to three), none
#active-indicator = true         # Needs integration.mru-event-stream
#drag-threshold = 6              # Pixels before an icon starts dragging; 1–100

# --- Keyboard activation (wl-dock --activate N) ---------------------------

#[activate]
#badges = true                   # Number the items while the modifier is held
#delay = 150                     # Before the dock shows anything (quick switches don't); 0–2000

# --- Autohide -------------------------------------------------------------

#[autohide]
#enabled = false
#reveal-delay = 150
#hide-delay = 500
#trigger = 2                     # Edge reveal band in pixels; 1–50

# --- Windows strip --------------------------------------------------------
# Clicking an app with several windows shows them as cards.

#[windows]
#scope = "all"                   # all, output (needs output-event-stream)
#output-grace = 250              # Wait for the stream to place new windows
#strip = true                    # false: clicking activates the latest window
#min-windows = 2                 # Below this, activate the most recent window
#max-columns = 3                 # Along the dock; 0 means unlimited
#max-rows = 3                    # Away from the dock; 0 means unlimited
#card-height = 0.18              # Fraction of output height
#max-width = 0.6                 # Fraction of output length; also caps card width
#previews = "live"               # live, static (one frame), off
#zoom = 1.04                     # Highlighted card scale; 1 disables it

# --- Launcher (wl-dock --launcher) ----------------------------------------

#[launcher]
#width = 0.4                     # Fraction of output width; at least the dock
#icon-scale = 1.25               # Selected app's icon, times icon-size; 1–3
#font-size = 20                  # Default: derived from icon-size
#matches = 5                     # Matches on the drum; 0–12
#far-scale = 0.5                 # Farthest match's size; 0.25–1
#enter = "activate"              # activate, launch (Ctrl+Enter does the other)
#history = true                  # Record launches to rank matches

# A query starting with the trigger searches files under root instead.
#[launcher.files]
#trigger = "'"                   # One character; "" turns file search off
#root = "~"
#exclude = ["node_modules", "target", "__pycache__"]  # Gitignore-style globs
#hidden = false                  # Include hidden files and directories
#gitignore = true                # Honor .gitignore, .ignore and git excludes
#max = 1000000                   # Entries searched at most; 1–100000000

# A query starting with the trigger searches every open window by title
# (and app name). Enter activates one with activate-command; Tab offers
# more, such as closing it with close-command.
#[launcher.windows]
#trigger = "@"                   # One character; "" turns window search off

# Web search is opt-in: uncomment the engines you want. Type ! to filter
# engines, then Tab to search with one. Ctrl+V can paste a whole bang.
#[launcher.web]
#bang-trigger = "!"              # One character; "" disables the trigger
#command = "xdg-open {url}"
#suggest = true                  # Send typed web queries to the selected engine
#fallback = "g"                  # Engine searched when no app matches; unset: none
#show = "empty"                  # "always": also last on the drum behind app matches
#fallback-suggest = false        # Also ask the fallback for suggestions as you type apps

#[launcher.web.engine.g]
#name = "Google"
#url = "https://www.google.com/search?q={query}"
#suggest = "https://suggestqueries.google.com/complete/search?client=firefox&q={query}"
# icon = "~/.local/share/icons/google.svg" # Local path or theme icon name

#[launcher.web.engine.d]
#name = "DuckDuckGo"
#url = "https://duckduckgo.com/?q={query}"
#suggest = "https://duckduckgo.com/ac/?type=list&q={query}"

#[launcher.web.engine.w]
#name = "Wikipedia"
#url = "https://en.wikipedia.org/wiki/Special:Search?search={query}"
#suggest = "https://en.wikipedia.org/w/api.php?action=opensearch&search={query}"

#[launcher.web.engine.y]
#name = "YouTube"
#url = "https://www.youtube.com/results?search_query={query}"
#suggest = "https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q={query}"

#[launcher.web.engine.a]
#name = "Amazon"
#url = "https://www.amazon.com/s?k={query}"

#[launcher.web.engine.gh]
#name = "GitHub"
#url = "https://github.com/search?q={query}"

#[launcher.web.engine.m]
#name = "Google Maps"
#url = "https://www.google.com/maps/search/?api=1&query={query}"

# --- Compositor integration -----------------------------------------------
# Commands run through `sh -c`. The commands below are niri examples; replace
# them with your compositor's equivalents. Without close-command, the menu has
# no Close entries.

#[integration]
#activate-command = "niri msg action focus-window --id {id}"   # Example
#close-command = "niri msg action close-window --id {id}"      # Example
#launch-command = "uwsm app -- {desktop-id}"  # Example; also {exec}, {app-id}
#terminal = "foot"               # For Terminal=true apps, e.g. "alacritty -e"
#open-terminal-command = "cd {dir} && exec foot"  # Launcher's Open terminal here
#launch-timeout = 10000          # Maximum launch bounce; 0–60000
#mru-event-stream = "~/.config/wl-dock/focus-stream.sh"     # Example
#output-event-stream = "~/.config/wl-dock/output-stream.sh" # Example

# --- Files, folders and Trash ---------------------------------------------
# {paths} is the list of dropped files, {dest} the destination folder.

#[trash]
#enabled = true
#command = "gio trash -- {paths}"
#empty-command = "gio trash --empty"

#[files]
#open-command = "xdg-open {path}"    # The Trash opens trash:///
#copy-command = "cp -rn -- {paths} {dest}"
#move-command = "mv -n -- {paths} {dest}"

# --- Appearance -----------------------------------------------------------
# Colors are "RRGGBB" or "RRGGBBAA", optionally prefixed with #. An alpha of
# 00 disables the corresponding shadow.

#[appearance]
#font = "sans-serif"
#font-size = 13
#response = 150                  # Animation spring response; 1–10000
#mode = "auto"                   # auto (desktop preference), dark, light
#icon-theme = "Papirus"          # Example; default: desktop setting, then hicolor
#panel-color = "262626b3"
#panel-radius = 16
#indicator-color = "ffffffb3"
#active-indicator-color = "ffffffff"
#label-color = "ffffffff"
#label-background = "262626e6"
#title-color = "ffffffff"
#title-background = "000000b3"
#placeholder = "3a3a3aff"        # Strip card before its preview arrives
#separator-color = "ffffff40"    # Between apps and Trash
#shadow-color = "00000066"
#shadow-softness = 24
#shadow-spread = 0               # Grow/shrink the shadow box; may be negative
#shadow-offset = [0, 4]          # [x, y]
#icon-shadow-color = "00000059"
#icon-shadow-softness = 6
#icon-shadow-offset = [0, 2]
#menu-background = "262626eb"
#menu-border = "ffffff1f"
#menu-radius = 12
#menu-tail = [10, 7]             # [width, height]
#menu-text = "ffffffff"
#menu-highlight = "ffffff2e"
#menu-highlight-text = "ffffffff"
#menu-separator = "ffffff26"
#menu-row-height = 28
#menu-padding = 6
#menu-group-gap = 8
#menu-max-width = 320
#menu-shadow-color = "00000066"
#menu-shadow-softness = 18
#menu-shadow-offset = [0, 4]
#launcher-background = "262626e6"
#launcher-text = "ffffffff"
#launcher-completion = "ffffff8c"
#launcher-match = "81d0ffff"
#launcher-caret = "ffffffcc"
#badge-color = "1f1f1fff"        # Item numbers during wl-dock --activate
#badge-background = "ffffffe6"

# Any appearance key can be overridden for just light or dark mode (example):
#[appearance.light]
#panel-color = "eeeeeecc"
#label-color = "202020"
#label-background = "eeeeeeee"

# --- Outputs (example) ----------------------------------------------------
# `output` is "all" or a pattern. A pattern is a connector name ("eDP-1"),
# a monitor's description or "<make> <model>" ("Dell Inc. DELL U2720Q"), or
# a glob over those ("Dell*", "*" for every output). `wl-dock outputs` lists
# yours. Every [outputs.<pattern>] table that matches an output applies, least
# specific first; outputs are enabled unless a table says enabled = false.
# To show the dock on one monitor only: disable "*", enable the monitor.
# These are all the keys a table can set.

#[outputs."eDP-1"]
#enabled = true
#position = "left"
#icon-size = 40
#magnification = 1.5
#reserve = true
#margin = 4
#[outputs."eDP-1".autohide]
#enabled = true
#[outputs."eDP-1".windows]
#scope = "output"
#max-columns = 2
#max-rows = 2

# --- Per-app settings (examples) ------------------------------------------
# Tables are keyed by Wayland app ID. Commands can use {app-id}, {id} (most
# recent window) and {ids} (all of the app's windows); drop uses {files}.

#[app."org.gnome.Nautilus"]
#name = "Files"
#icon = "system-file-manager"    # Icon theme name or file path
#launch-command = "nautilus --new-window"
#desktop-actions = true          # Show the desktop entry's actions
#drop = "nautilus {files}"
#actions = [{ name = "New window", command = "nautilus --new-window", icon = "window-new" }]

#[app.spotify]
#middle-click = "playerctl play-pause"
#scroll-up = "playerctl next"
#scroll-down = "playerctl previous"
#actions = [
#{ name = "Play/Pause", command = "playerctl play-pause", when = "running" },
#{ name = "Next", command = "playerctl next", icon = "media-skip-forward", when = "running" },
#]

# --- Widgets (examples) ---------------------------------------------------
# A widget is a Lua plugin behind an app's item, or an item of its own: it
# can set the item's label, draw its icon and show a popup. A plugin name
# is looked up as plugins/<name>.lua next to this file, then among the
# bundled plugins (calc, calendar, clock, convert, player, recent, unread). Plugin files are reloaded on save.

#[app.foot]
#widget = { plugin = "clock", format = "%H:%M:%S", face = true }  # Or a name: widget = "clock"
#popup-delay = 400               # Hover before its popup opens

# A standalone widget: an item of its own, shown while `@clock` is pinned
# (`wl-dock pin @clock`). Remove from Dock unpins it and keeps this table.
#[widget.clock]
#plugin = "clock"                # Default: the table's name
#name = "Clock"                  # Its label; default: the table's name
#popup-delay = 600
#format = "%H:%M"                # Other keys are options for the plugin

# The media player (MPRIS): the cover as the app's icon, and a popup
# that plays, pauses, skips and seeks. It finds the app's own player by
# its names; `player` names one by bus name instead.
#[app."dev.diegovsky.Riff"]
#widget = "player"
#[app.firefox]
#widget = { plugin = "player", player = "firefox" }

# Show the count, progress (an arc around the icon) and urgency ("!")
# published by an app over Unity LauncherEntry D-Bus signals.
#[app."co.hyprlab.Hylki"]
#widget = "unread"
# Badge position: top-left, top, top-right (default), left, center, right,
# bottom-left, bottom, or bottom-right.
# widget = { plugin = "unread", position = "bottom-left" }
# Optional desktop ID override when the launcher uses a different ID:
# widget = { plugin = "unread", desktop-entry = "co.hyprlab.Hylki.desktop" }

# Standalone, it follows whichever player plays (`wl-dock pin @nowplaying`).
#[widget.nowplaying]
#plugin = "player"
#name = "Now Playing"
#span = "extra-wide"             # wide or extra-wide: wider on a bottom dock, with the title beside the cover

# An app's recent documents (from recently-used.xbel) in a popup on hover,
# with thumbnails; clicking one opens it in the app again.
#[app."org.gnome.Papers"]
#widget = "recent"
# Names the app records files under, if the dock's names don't match:
# widget = { plugin = "recent", apps = ["soffice"], count = 8 }

#[plugin.clock]                  # Defaults for every placement of the plugin
#path = "~/src/clock.lua"        # Optional; default lookup by name
#format = "%H:%M"

# Launcher actions: Tab on an image in the launcher offers Convert image…
# (with ImageMagick). A plugin table is all it takes.
#[plugin.convert]
#formats = ["png", "jpg", "webp", "avif"]
#command = ["magick"]            # ["convert"] for ImageMagick 6
#notify = true                   # notify-send when done or failed

# Launcher sources: a calculator behind `=` in the launcher (`=2^10`,
# `=15% of 80`, `=0xff in bin`, `=10 km in mi`); Enter copies the result.
#[plugin.calc]
#precision = 12                  # Significant digits; 1-17
#angle = "rad"                   # or "deg" for sin, cos, tan and their inverses
#grouping = true                 # 1,234,567 (copied without commas)
#extras = true                   # Hex and binary, fractions, other units
#history = 20                    # Results the empty query lists

#[widgets]
#enabled = true
#popup-delay = 300
#budget = 1000000                # Lua instructions per hook call

# --- Per-folder settings (example) ----------------------------------------
# Customizes a pinned folder (`wl-dock pin ~/Downloads`); it does not pin it.

#[folder."~/Downloads"]
#sort = "modified"               # modified, added, name
#count = 10                      # Maximum entries; 1–100
#view = "stack"                  # stack (fanned icons), list (a menu)
#icon = "folder-download"        # Example

