[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

# Versions are pinned here once; members use `foo.workspace = true`.
[workspace.dependencies]
wl-shell-config = { path = "crates/wl-shell-config", version = "0.1.0" }
wl-shell-core = { path = "crates/wl-shell-core", version = "0.1.0" }
wl-shell-daemon = { path = "crates/wl-shell-daemon", version = "0.1.0" }
wl-shell-log = { path = "crates/wl-shell-log", version = "0.1.0" }
wl-shell-lua = { path = "crates/wl-shell-lua", version = "0.1.0" }
wl-shell-notes = { path = "crates/wl-shell-notes", version = "0.1.0" }
wl-shell-render = { path = "crates/wl-shell-render", version = "0.1.0" }
wl-shell-ui = { path = "crates/wl-shell-ui", version = "0.1.0" }

async-channel = "2"
async-executor = "1"
async-io = "2"
calloop = "0.14"
calloop-wayland-source = "0.4"
clap = { version = "4", features = ["derive"] }
cosmic-text = "0.17"
drm-fourcc = "2"
freedesktop-desktop-entry = { version = "0.8", default-features = false }
freedesktop-icons = "0.4"
futures-lite = "2"
gbm = { version = "0.18", default-features = false }
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "serialize"] }
nucleo = "0.5"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = { version = "0.50", default-features = false, features = ["raster-images"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21"
svgtypes = "0.16"
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
toml = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
unicode-normalization = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

# The randomized layout tests run thousands of layouts.
[profile.test]
opt-level = 2

